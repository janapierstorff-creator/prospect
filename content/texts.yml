# ─── DATENSCHUTZ (nur Deutsch) ────────────────────────────────────────

datenschutz:

  meta:
    title:
      de: Datenschutz – ProspectFuel
    description:
      de: Datenschutz von ProspectFuel
    share_title:
      de: Datenschutz – ProspectFuel
    share_description:
      de: Datenschutz von ProspectFuel

  inhalt:
    headline:
      de: Datenschutzerklärung
    text:
      de: "Stand: November 2026"
    headline_2:
      de: 1. Verantwortliche Stelle
    text_2:
      de: Jana Pierstorff
    text_3:
      de: Wallstraße 86
    text_4:
      de: 10179 Berlin
    text_5:
      de: "E-Mail:"
    link:
      de: jana@prospect-fuel.com
    headline_3:
      de: 2. Warteliste
    text_6:
      de: Wenn du dich für die ProspectFuel-Warteliste anmeldest, verarbeiten wir deine E-Mail-Adresse, deine angegebene Rolle (Elternteil, Athlet:in ab 16 Jahren oder Coach) sowie freiwillige Angaben wie Alter des Kindes, Sportart, Name oder Verein. Außerdem speichern wir den Zeitpunkt der Anmeldung und deine Einwilligung.
    text_7:
      de: Sofern technisch erfasst, speichern wir zusätzlich, über welche Seite oder welchen Anmeldelink du zu uns gekommen bist. Dazu gehören die Seite, auf der du dich angemeldet hast, die zuvor besuchte Seite (Referrer) und Kampagnenkennungen im Link (sogenannte UTM-Parameter).
    text_doi:
      de: "Nach dem Absenden schicken wir dir eine E-Mail mit einem Bestätigungslink (Double-Opt-in). Erst wenn du darauf klickst, nehmen wir dich in die Warteliste auf. Zum Nachweis deiner Einwilligung speichern wir den Zeitpunkt der Anmeldung, des Versands der Bestätigungs-E-Mail und deiner Bestätigung. Anmeldungen, die nicht innerhalb von 30 Tagen bestätigt werden, löschen wir automatisch. Nach der Bestätigung erhältst du eine Willkommens-E-Mail."
    text_8:
      de: Wir verwenden diese Angaben, um dich über den Start von ProspectFuel, die Pilotphase und deine Teilnahmemöglichkeiten zu informieren sowie das Interesse an unserem Angebot auszuwerten.
    text_9:
      de: Rechtsgrundlage ist deine Einwilligung gemäß Art. 6 Abs. 1 lit. a DSGVO.
    text_10:
      de: Junge Athlet:innen unter 16 Jahren können sich nicht selbst anmelden. Für sie melden sich die Eltern an.
    text_11:
      de: Du kannst deine Einwilligung jederzeit mit Wirkung für die Zukunft per E-Mail widerrufen. Deine Daten werden dann gelöscht, soweit keine gesetzlichen Aufbewahrungspflichten entgegenstehen.
    text_12:
      de: Wir speichern deine Daten bis zum Widerruf deiner Einwilligung oder bis der Zweck der Warteliste entfällt. Spätestens zwölf Monate nach Ende der Pilotphase, längstens jedoch 24 Monate nach deiner Anmeldung, löschen wir deine Daten.
    headline_4:
      de: 3. Hosting und technische Dienstleister
    text_13:
      de: "GitHub Pages:"
    text_14:
      de: Unsere Website wird über GitHub Pages (GitHub, Inc., USA) bereitgestellt. Beim Besuch können technisch erforderliche Daten wie IP-Adresse, Browserinformationen und Zugriffszeitpunkt verarbeitet werden. Dies dient der sicheren und zuverlässigen Bereitstellung unserer Website. Rechtsgrundlage ist Art. 6 Abs. 1 lit. f DSGVO.
    text_15:
      de: "Supabase:"
    text_16:
      de: Für die Speicherung der Wartelisten-Anmeldungen nutzen wir Supabase (Supabase, Inc., USA). Die Datenbank wird in der Region Frankfurt am Main (EU) betrieben. Beim Absenden des Formulars verarbeitet Supabase technisch bedingt auch deine IP-Adresse. Mit Supabase besteht ein Vertrag zur Auftragsverarbeitung nach Art. 28 DSGVO.
    text_resend_title:
      de: "Resend:"
    text_resend:
      de: Für den Versand der Bestätigungs-, Willkommens- und Informations-E-Mails nutzen wir Resend (Plus Five Five, Inc., USA). Die E-Mails werden über Server in der EU (Irland) versendet. Dabei verarbeitet Resend deine E-Mail-Adresse, den Inhalt der E-Mail sowie technische Versanddaten wie Zustellstatus und Zeitpunkt. Mit Resend besteht ein Vertrag zur Auftragsverarbeitung nach Art. 28 DSGVO.
    text_google_title:
      de: "Google Workspace:"
    text_google:
      de: Für unser E-Mail-Postfach nutzen wir Google Workspace (Google Cloud EMEA Limited, Irland). Wenn du uns schreibst oder auf eine unserer E-Mails antwortest, wird deine Nachricht dort verarbeitet. Mit Google besteht ein Vertrag zur Auftragsverarbeitung nach Art. 28 DSGVO.
    text_17:
      de: "Bei der Nutzung unserer Dienstleister kann es zu Datenübermittlungen außerhalb der EU beziehungsweise des EWR kommen. Soweit erforderlich, erfolgen diese auf Grundlage geeigneter datenschutzrechtlicher Garantien: GitHub ist unter dem EU-U.S. Data Privacy Framework zertifiziert, für Übermittlungen an GitHub gilt damit der Angemessenheitsbeschluss der EU-Kommission (Art. 45 DSGVO). Google ist ebenfalls unter dem EU-U.S. Data Privacy Framework zertifiziert. Für Übermittlungen an Supabase und Resend gelten die EU-Standardvertragsklauseln (Art. 46 Abs. 2 lit. c DSGVO), die Bestandteil der jeweiligen Auftragsverarbeitungsverträge sind."
    headline_5:
      de: 4. Schriften und Icons
    text_18:
      de: Schriften und Icons werden lokal auf unserer Website bereitgestellt. Dafür werden keine externen Schrift- oder Icon-Dienste aufgerufen.
    headline_6:
      de: 5. Speicher im Browser
    text_19:
      de: Wir setzen keine Cookies und keine Analyse- oder Tracking-Tools ein. Um dir die passende Sprachversion anzuzeigen, liest die Website die Spracheinstellung deines Browsers aus. Das geschieht nur in deinem Browser, die Einstellung wird weder gespeichert noch an uns übertragen.
    text_20:
      de: "Unsere Website legt lediglich zwei kleine Einträge im Speicher deines Browsers ab:"
    item:
      de: Wenn du über einen Link mit Kampagnenkennung (UTM-Parameter) kommst, merkt sich die Website diese Kennung für die Dauer deines Besuchs, damit sie bei einer Anmeldung mitgespeichert werden kann. Der Eintrag wird beim Schließen des Browserfensters automatisch gelöscht.
    item_2:
      de: Wenn du über die Sprachumschaltung (DE/EN) eine Sprache wählst, merkt sich die Website diese Wahl, damit du beim nächsten Besuch direkt in deiner Sprache landest.
    headline_7:
      de: 6. Deine Rechte
    text_21:
      de: Du hast nach Maßgabe der DSGVO das Recht auf Auskunft, Berichtigung, Löschung, Einschränkung der Verarbeitung, Datenübertragbarkeit sowie gegebenenfalls Widerspruch gegen bestimmte Verarbeitungen.
    text_22:
      de: Du kannst eine erteilte Einwilligung jederzeit mit Wirkung für die Zukunft widerrufen.
    text_23:
      de: Außerdem hast du das Recht, dich bei einer Datenschutzaufsichtsbehörde zu beschweren, insbesondere bei der Berliner Beauftragten für Datenschutz und Informationsfreiheit.
    headline_8:
      de: 7. Pflicht zur Bereitstellung
    text_24:
      de: Die Angabe deiner E-Mail-Adresse ist für die Anmeldung zur Warteliste erforderlich. Weitere als optional gekennzeichnete Angaben sind freiwillig.
    text_25:
      de: Ohne E-Mail-Adresse ist eine Aufnahme in die Warteliste nicht möglich.
    text_26:
      de: Eine automatisierte Entscheidungsfindung einschließlich Profiling gemäß Art. 22 DSGVO findet nicht statt.

