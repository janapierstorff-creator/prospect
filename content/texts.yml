# Alle Texte der Website, Deutsch (de) und Englisch (en).
# Nach dem Speichern auf GitHub baut die Seite sich automatisch neu (ca. 1–2 Minuten).
#
# In Texten auf der Seite (nicht in Bild-Beschreibungen und Platzhaltern) gibt es drei Zeichen:
#   /       Zeilenumbruch, z. B.  Real fuel. / *Real progress.*
#   *Text*  Text in Blau
#   **Text** Text fett
# Enthält ein Text einen Doppelpunkt mit Leerzeichen dahinter oder beginnt mit einem Sonderzeichen,
# muss er in Anführungszeichen stehen: "So geht's: ..."
#
# Aufbau: Seite → Abschnitt (in der Reihenfolge der Seite) → Element.
# Abschnitte mit _screens enthalten die Texte in den Handy-Mockups.
# vorlesetext = Text für Screenreader, image_alt = Bildbeschreibung (beides unsichtbar, aber wichtig).

# ─── NAVIGATION UND FOOTER (auf allen Seiten) ────────────────────────────────────────

