    en: ProspectFuel home
  logo:
    de: ProspectFuel
    en: ProspectFuel
  navigation_vorlesetext:
    de: Hauptnavigation
    en: Main navigation
  nav_athleten:
    de: Athleten
    en: Athletes
  nav_eltern:
    de: Eltern
    en: Parents
  nav_coaches:
    de: Coaches
    en: Coaches
  nav_button:
    de: Platz sichern
    en: Save your spot
  menue_vorlesetext:
    de: Menü öffnen
    en: Open menu
  footer_vorlesetext:
    de: Rechtliches
    en: Legal
  footer_impressum:
    de: Impressum
    en: Legal notice (in German)
  footer_datenschutz:
    de: Datenschutz
    en: Privacy (in German)

# ─── STARTSEITE ────────────────────────────────────────

meldungen:
  # Texte, die erst durch eine Aktion erscheinen (nach dem Absenden, beim Teilen). Gelten für alle Seiten.
  formular:
    erfolg_titel:
      de: Fast geschafft!
      en: Almost there!
    erfolg_text:
      de: Wir haben dir eine E-Mail geschickt. Bitte bestätige darin deine Anmeldung, erst dann ist dein Platz gesichert.
      en: We've sent you an email. Please confirm your sign-up there to lock in your spot.
    erfolg_text_coach:
      de: Wir haben dir eine E-Mail geschickt. Bitte bestätige darin die Anmeldung deines Teams, erst dann seid ihr vorgemerkt.
      en: We've sent you an email. Please confirm your team's sign-up there to lock in your spot.
    fehler_rolle:
      de: Bitte wähle aus, wer du bist.
      en: Please choose who you are.
    fehler_senden:
      de: Das hat leider nicht geklappt. Bitte versuch es gleich noch einmal.
      en: Something went wrong. Please try again in a moment.
  teilen:
    # Nachricht, wenn Athleten unter 16 die Eltern-Seite an ihre Eltern schicken (der Link wird automatisch angehängt)
    text:
      de: Hey, ich will bei ProspectFuel mitmachen. Kannst du mich hier eintragen?
      en: Hey, I want to join ProspectFuel. Can you sign me up here?
  karussell:
    # Vorlesetext für die Punkte unter den Karten auf dem Handy, # wird durch die Nummer ersetzt
    punkt_vorlesetext:
      de: "Karte # anzeigen"
      en: "Show card #"

emails:
  # Texte der automatischen E-Mails. Platzhalter in geschweiften Klammern ({name}, {link}) nicht ändern.
  # Betreff und Vorschau (die graue Zeile im Posteingang) ohne * und /.
  anrede:
    mit_name:
      de: Hi {name},
      en: Hi {name},
    ohne_name:
      de: Hi,
      en: Hi,
  bestaetigung:
    betreff:
      de: Bitte bestätige deine Anmeldung bei ProspectFuel
      en: Please confirm your ProspectFuel sign-up
    vorschau:
      de: Ein Klick noch, dann ist dein Platz auf der Warteliste gesichert.
      en: One more click and your spot on the waitlist is saved.
    headline:
      de: Ein Klick noch.
      en: One more click.
    text:
      de: danke für dein Interesse an ProspectFuel! Bitte bestätige kurz deine E-Mail-Adresse, damit wir dich auf die Warteliste für unseren Start in Berlin setzen können.
      en: thanks for your interest in ProspectFuel! Please confirm your email address so we can add you to the waitlist for our Berlin launch.
    button:
      de: Anmeldung bestätigen
      en: Confirm sign-up
    link_hinweis:
      de: "Falls der Button nicht funktioniert, kopiere diesen Link in deinen Browser: {link}"
      en: "If the button doesn't work, copy this link into your browser: {link}"
    hinweis:
      de: Du hast dich nicht angemeldet? Dann ignoriere diese E-Mail einfach. Ohne Bestätigung speichern wir nichts dauerhaft.
      en: Didn't sign up? Just ignore this email. Without confirmation we won't keep your details.
  willkommen:
    betreff:
      de: Du bist dabei! Willkommen bei ProspectFuel
      en: You're in! Welcome to ProspectFuel
    vorschau:
      de: Deine Anmeldung ist bestätigt. Hier erfährst du, wie es weitergeht.
      en: Your sign-up is confirmed. Here's what happens next.
    headline:
      de: Du bist *dabei.*
      en: You're *in.*
    text:
      de: deine Anmeldung ist bestätigt. Du stehst jetzt auf der Warteliste für den Start von ProspectFuel in Berlin.
      en: your sign-up is confirmed. You're now on the waitlist for the ProspectFuel launch in Berlin.
    text_spieler:
      de: Wir bauen gerade deinen persönlichen Fueling-Coach, damit du mit vollem Akku in jedes Training und jedes Spiel gehst.
      en: We're building your personal fueling coach so you can go into every practice and every game fully charged.
    text_eltern:
      de: Wir bauen gerade die Unterstützung, die euch die Ernährungsplanung abnimmt, damit euer Kind gut versorgt ist, ohne dass ihr Experten werden müsst.
      en: We're building the support that takes nutrition planning off your plate, so your child is well fueled without you having to become experts.
    text_coach:
      de: Wir bauen gerade die Lösung, mit der deine Spieler besser vorbereitet ins Training kommen und du siehst, wo du unterstützen kannst.
      en: We're building the solution that helps your players show up better prepared and shows you where to help.
    text_2:
      de: "**Wie geht es weiter?** Sobald die Pilotphase startet, melden wir uns bei dir mit allen Infos, wie du dabei sein kannst."
      en: "**What's next?** As soon as the pilot starts, we'll get in touch with everything you need to take part."
    button:
      de: Zur Website
      en: Visit the website
    text_3:
      de: Fragen oder Ideen? Antworte einfach auf diese E-Mail, wir lesen alles.
      en: Questions or ideas? Just reply to this email, we read everything.
  footer:
    text:
      de: Du bekommst diese E-Mail, weil du dich auf prospect-fuel.com für die Warteliste angemeldet hast. Abmelden kannst du dich jederzeit mit einer kurzen Antwort auf diese E-Mail.
      en: You're receiving this email because you joined the waitlist on prospect-fuel.com. You can unsubscribe at any time by replying to this email.
    # Links unter jeder Mail (führen auf die Seiten de/impressum.html und de/datenschutz.html)
    impressum:
      de: Impressum
      en: Legal notice
    datenschutz:
      de: Datenschutz
      en: Privacy policy

start:

  meta:
    title:
      de: ProspectFuel – Der Fueling Coach für junge Athleten
      en: ProspectFuel – The fueling coach for young athletes
    description:
      de: Der Trainingsplan steht – die Energie dafür auch? ProspectFuel ist der Fueling Coach für junge Athleten und ihre Eltern. Jetzt Platz sichern.
      en: The training plan is set – is the fuel? ProspectFuel is the fueling coach for young athletes and their parents. Save your spot.
    share_title:
      de: ProspectFuel – Fueling Next Gen Athletes
      en: ProspectFuel – Fueling Next Gen Athletes
    share_description:
      de: Der Fueling Coach für junge Athleten, ihre Eltern und Coaches. Erste Kohorte in Berlin.
      en: The fueling coach for young athletes, their parents and coaches. First cohort in Berlin.

  hero:
    image_alt:
      de: Junger Basketballspieler in der Halle, konzentriert beim Dribbeln
      en: Young basketball player in a gym, focused while dribbling
    kicker:
      de: Fueling Next Gen Athletes
      en: Fueling Next Gen Athletes
    headline:
      de: Right fuel. / *Real progress.*
      en: Right fuel. / *Real progress.*
    sub:
      de: Dein Fueling-Coach für mehr Energie im Training, im Spiel und auf dem Weg nach oben.
      en: Your fueling coach for more energy at practice, on game day and on your way up.
    button:
      de: Jetzt Platz sichern
      en: Save your spot

  zielgruppen:
    kicker:
      de: Ein Ziel. Drei Perspektiven.
      en: One goal. Three perspectives.
    image_alt:
      de: Junger Basketballspieler dribbelt konzentriert
      en: Young basketball player dribbling with focus
    title:
      de: Für Athleten
      en: For athletes
    text:
      de: "**Energie bis zur letzten Minute.** Hol mehr aus jedem Training und heb dein Spiel aufs nächste Level."
      en: "**Energy to the last minute.** Get more out of every session and take the next step as an athlete."
    image_alt_2:
      de: Mutter und Sohn bereiten gemeinsam eine Mahlzeit vor
      en: Mother and son preparing a meal together
    title_2:
      de: Für Eltern
      en: For parents
    text_2:
      de: "**Ihr unterstützt den Traum.** Wir sorgen dafür, dass die Ernährung im Alltag einfach klappt."
      en: "**You support the dream.** We make fueling simple, every day."
    image_alt_3:
      de: Coach bespricht sich mit seinem Team
      en: Coach talking with his team
    title_3:
      de: Für Coaches
      en: For coaches
    text_3:
      de: "**Mehr Energie fürs gemeinsame Ziel.** Damit dein Team vorbereitet ins Training kommt."
      en: "**More energy for the shared goal.** So your team shows up to practice ready."

  herausforderung:
    image_alt:
      de: Erschöpfter junger Basketballspieler sitzt mit Handtuch und Trinkflasche in der Halle
      en: Exhausted young basketball player sitting in a gym with a towel and water bottle
    kicker:
      de: Die Herausforderung
      en: The challenge
    headline:
      de: Talent braucht *Energie.*
      en: Talent runs *on fuel.*
    sub:
      de: Am Willen fehlt es selten. Am Tank schon.
      en: Willpower is rarely the problem. The tank is.
    title:
      de: Der Bedarf
      en: The demand
    text:
      de: Training, Schule und Wachstum. Alles gleichzeitig.
      en: Training, school and growth. All at once.
    title_2:
      de: Die Lücke
      en: The gap
    text_2:
      de: Zwischen Schule und Halle bleibt das Essen auf der Strecke.
      en: Between school and practice, food gets lost.
    title_3:
      de: Die Folge
      en: The result
    text_3:
      de: Das Talent ist da. Die Energie fehlt.
      en: The talent is there. The energy isn't.
    quote:
      de: „Mein Kopf will noch. Aber mein Körper kann nicht mehr.“
      en: “My head wants to keep going. But my body is done.”

  loesung:
    image_alt:
      de: ProspectFuel App neben den geplanten ProspectFuel Produkten
      en: ProspectFuel app next to the planned ProspectFuel products
    text:
      de: Bald verfügbar
      en: Coming soon
    kicker:
      de: Die Lösung
      en: The solution
    headline:
      de: Wir denken dran. / *Du spielst.*
      en: We’ve got it covered. / *You play.*
    text_2:
      de: Damit junge Athleten mit Energie ins Training starten und bis zum Schluss alles geben können.
      en: So young athletes start training with energy and give it everything right to the end.
    text_3:
      de: ProspectFuel verbindet persönliche Fueling-Pläne, einen digitalen Coach für den Alltag und bald auch passende Produkte rund ums Training. Abgestimmt auf die Bedürfnisse junger Athleten mit Unterstützung für Eltern und Coaches.
      en: ProspectFuel combines personal fueling plans, a digital everyday coach and, soon, products made for practice and game days. Built for the needs of young athletes with support for parents and coaches.

  timing:
    aria_label:
      de: Vorher, währenddessen, danach
      en: Before, during, after
    title:
      de: Vorher.
      en: Before.
    text:
      de: Bereit ins Training. / Energie aufbauen.
      en: Ready for practice. / Build energy.
    title_2:
      de: Währenddessen.
      en: During.
    text_2:
      de: Energie bis zum Schluss. / Stark bleiben.
      en: Energy to the final buzzer. / Stay strong.
    title_3:
      de: Danach.
      en: After.
    text_3:
      de: Auftanken. / Bereit fürs nächste Mal.
      en: Refuel. / Ready for the next one.

  so_funktionierts:
    kicker:
      de: So funktioniert’s
      en: How it works
    headline:
      de: Dein Plan. Dein Coach. / Dein Fortschritt.
      en: Your plan. Your coach. / *Your progress.*
    title:
      de: Profil erstellen
      en: Create a profile
    text:
      de: Training, Alltag und Ziele angeben.
      en: Add training, schedule and goals.
    title_2:
      de: Persönlich begleitet werden
      en: Get personal guidance
    text_2:
      de: Passende Fueling-Pläne und Erinnerungen zum richtigen Zeitpunkt.
      en: Matching fueling plans and reminders at the right time.
    title_3:
      de: Fortschritt erleben
      en: See your progress
    text_3:
      de: Routinen aufbauen und sehen, wie sich deine Energie entwickelt.
      en: Build routines and watch your energy grow.

  warum:
    image_alt:
      de: Jana, Gründerin von ProspectFuel
      en: Jana, founder of ProspectFuel
    kicker:
      de: Warum wir ProspectFuel entwickeln
      en: Why we're building ProspectFuel
    headline:
      de: Talent braucht mehr / als Training.
      en: Talent takes more / than *training.*
    text:
      de: Als Mutter eines jungen Basketballspielers habe ich erlebt, wie schwer es ist, Schule, Training und die richtige Ernährung unter einen Hut zu bekommen.
      en: As the mother of a young basketball player, I've seen how hard it is to juggle school, training and the right nutrition.
    text_2:
      de: "Genau deshalb entwickeln wir ProspectFuel: Damit junge Athleten die Energie bekommen, die sie brauchen, um ihr Potenzial auszuschöpfen."
      en: "That's exactly why we're building ProspectFuel: so young athletes get the energy they need to reach their potential."
    text_3:
      de: Entwickelt im Austausch mit Experten aus der Sporternährung.
      en: Developed with input from sports nutrition experts.
    text_4:
      de: „Fueling is a skill. One that makes a difference.“
      en: “Fueling is a skill. One that makes a difference.”
    text_5:
      de: "**Jana**Gründerin von ProspectFuel"
      en: "**Jana**Founder of ProspectFuel"

  warteliste:
    image_alt:
      de: Gruppe junger Athletinnen und Athleten auf dem Weg zum Training, im Hintergrund der Berliner Fernsehturm
      en: Group of young athletes on their way to training, with Berlin's TV tower in the background
    headline:
      de: Berlin startet / *zuerst.*
      en: Berlin / *goes first.*
    sub:
      de: 50 Plätze für junge Athleten und ihre Familien.
