  warum:
    image_alt:
      de: Jana Pierstorff, Gründerin von ProspectFuel
      en: Jana Pierstorff, founder of ProspectFuel
    kicker:
      de: Warum wir ProspectFuel entwickeln
      en: Why we're building ProspectFuel
    headline:
      de: Weil Talent mehr als Training braucht.
      en: Because talent takes *more than training.*
    text:
      de: "„Als ich ausgerechnet habe, wie viel Energie mein Sohn an Trainingstagen braucht, dachte ich: Das kann nicht stimmen."
      en: "“When I figured out how much energy my son needs on training days, I thought: that can't be right."
    text_2:
      de: Es stimmte. Und wir lagen meilenweit daneben.
      en: It was right. And we were miles off.
    text_3:
      de: "Da wurde mir klar: Wir investieren so viel in Training und Entwicklung. Aber bei der Ernährung fehlt oft die richtige Unterstützung.“"
      en: "That’s when I realized: we invest so much in training and development. But when it comes to nutrition, the right support is often missing.”"
    text_4:
      de: Jana Pierstorff
      en: Jana Pierstorff
    text_5:
      de: Gründerin von ProspectFuel · Basketball-Mutter
      en: Founder of ProspectFuel · Basketball mom

  werte:
    title:
      de: Lebensmittel zuerst.
      en: Food first.
    text:
      de: Echte Lebensmittel, alltagstauglich.
      en: Real food that fits for everyday life.
    title_2:
      de: Keine Diät.
      en: No diets.
    text_2:
      de: Genug Energie für Wachstum, Training und Regeneration.
      en: Enough energy for growth, training and recovery.
    title_3:
      de: Altersgerecht.
      en: Age-appropriate.
    text_3:
      de: Abgestimmt auf die Bedürfnisse junger Athleten. Entwickelt im Austausch mit Ernährungsexperten.
      en: Tailored to the needs of young athletes. Developed with input from nutrition experts.

  faq:
    kicker:
      de: FAQ
      en: FAQ
    headline:
      de: Gut zu wissen.
      en: Good to *know.*
    question:
      de: Für welches Alter ist ProspectFuel gedacht?
      en: What age is ProspectFuel for?
    text:
      de: Für junge Athlet:innen zwischen 12 und 18 Jahren, die regelmäßig trainieren und sich sportlich weiterentwickeln wollen.
      en: For young athletes aged 12 to 18 who train regularly and want to keep developing in their sport.
    question_2:
      de: Ist ProspectFuel nur für Basketball?
      en: Is ProspectFuel only for basketball?
    text_2:
      de: Nein. Wir starten mit Basketball, entwickeln ProspectFuel aber für junge Athlet:innen verschiedener Sportarten.
      en: No. We're starting with basketball, but we're building ProspectFuel for young athletes across different sports.
    question_3:
      de: Braucht mein Kind spezielle Produkte?
      en: Does my child need special products?
    text_3:
      de: Nein. Normale Lebensmittel sind die Basis. Ergänzende Fueling-Produkte rund ums Training sind für später geplant.
      en: No. Everyday food is the foundation. Complementary fueling products around training are planned for later.
    question_4:
      de: Ist ProspectFuel auf Jugendliche abgestimmt?
      en: Is ProspectFuel designed for teenagers?
    text_4:
      de: Ja. Wir entwickeln ProspectFuel speziell für junge Athleten und ihre Bedürfnisse in Wachstum und Training im Austausch mit Experten aus der Sporternährung.
      en: Yes. We’re building ProspectFuel specifically for young athletes and their needs during growth and training with input from sports nutrition experts.
    question_5:
      de: Was passiert nach der Anmeldung?
      en: What happens after I sign up?
    text_5:
      de: Ihr kommt auf die Warteliste für unseren Berliner Start. Wir melden uns, sobald es losgeht, und sagen euch, wie ihr dabei sein könnt.
      en: You’ll join the waitlist for our Berlin launch. We’ll get in touch as soon as we start and let you know how to take part.
    question_6:
      de: Was kostet ProspectFuel?
      en: How much does ProspectFuel cost?
    text_6:
      de: Die Pilotphase in Berlin ist kostenlos. Wie es danach weitergeht, erfahrt ihr rechtzeitig ohne automatische Verlängerung.
      en: The Berlin pilot is free. We’ll let you know in good time what comes next with no automatic renewal.
    question_7:
      de: Was passiert mit den Daten meines Kindes?
      en: What happens to my child’s data?
    text_7:
      de: Datenschutz hat für uns oberste Priorität. Wir speichern nur, was für den persönlichen Plan nötig ist, verarbeiten die Daten nach DSGVO und geben sie nicht an Dritte weiter.
      en: Data protection is our top priority. We only store what’s needed for the personal plan, process data in line with GDPR and never share it with third parties.
    question_8:
      de: Was ist bei Allergien oder Unverträglichkeiten?
      en: What about allergies or intolerances?
    text_8:
      de: Bei der Anmeldung könnt ihr Allergien, Unverträglichkeiten und Essgewohnheiten angeben. Die Pläne werden darauf abgestimmt. Eine ärztliche Beratung ersetzt ProspectFuel nicht.
      en: When signing up, you can add allergies, intolerances and food preferences. The plans are tailored to them. ProspectFuel doesn’t replace medical advice.
  warteliste:
    image_alt:
      de: Berliner Skyline in der Dämmerung
      en: Berlin skyline at dusk
    headline:
      de: Berlin startet. / *Seid dabei.*
      en: Berlin is starting. / *Join us.*
    text:
      de: 50 Plätze für junge Athleten und ihre Familien in Berlin.
      en: 50 spots for young athletes and their families in Berlin.
    text_2:
      de: Testet ProspectFuel als Erste und gestaltet mit, wie wir junge Athleten künftig unterstützen.
      en: Be among the first to try ProspectFuel and help shape how we support young athletes.
