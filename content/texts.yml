# ─── ELTERN ────────────────────────────────────────

eltern:

  meta:
    title:
      de: Für Eltern – ProspectFuel
      en: For parents – ProspectFuel
    description:
      de: Du unterstützt den Traum deines Kindes. Wir helfen dir, es im Alltag optimal zu versorgen – mit einfachen Lösungen und alltagstauglichen Rezepten.
      en: You support your child's dream. We help you fuel them well every day – with simple solutions and practical recipes.
    share_title:
      de: Du unterstützt den Traum. Wir unterstützen dich. – ProspectFuel
      en: You support the dream. We support you. – ProspectFuel
    share_description:
      de: Du unterstützt den Traum deines Kindes. Wir helfen dir, es im Alltag optimal zu versorgen – mit einfachen Lösungen und alltagstauglichen Rezepten.
      en: You support your child's dream. We help you fuel them well every day – with simple solutions and practical recipes.

  hero:
    image_alt:
      de: Mutter und Sohn bereiten gemeinsam eine Mahlzeit zu
      en: Mother and son preparing a meal together
    headline:
      de: Ihr unterstützt / den Traum. / *Wir unterstützen / euch.*
      en: You support / the dream. / *We support / you.*
    sub:
      de: "Fahrdienst, Fan, Koch: Ihr macht schon so viel."
      en: "Driver, fan, cook: you already do so much."
    sub_2:
      de: "**ProspectFuel** nimmt euch die Ernährungsplanung ab, damit euer Kind gut versorgt ist, ohne dass ihr Experten werden müsst."
      en: "**ProspectFuel** takes nutrition planning off your plate, so your child is well fueled without you having to become experts."
    button:
      de: Platz sichern
      en: Save your spot
    headline_2:
      de: Mehr Sicherheit.
      en: More confidence.
    text:
      de: Persönliche Pläne für Wachstum und Training.
      en: Personalized plans for growth and training.
    headline_3:
      de: Weniger planen.
      en: Less planning.
    text_2:
      de: Wochenpläne, Rezepte und Einkaufslisten.
      en: Weekly plans, recipes and shopping lists.
    headline_4:
      de: Weniger nachhaken.
      en: Less nagging.
    text_3:
      de: Reminder gehen direkt an euer Kind.
      en: Reminders go straight to your child.
    headline_5:
      de: Mehr Selbstständigkeit.
      en: More independence.
    text_4:
      de: Euer Kind lernt, sich selbst richtig zu versorgen.
      en: Your child learns to fuel themselves right.

  herausforderung:
    image_alt:
      de: Junge Spielerin sitzt mit Trinkflasche in der Halle
      en: Young player sitting in a gym with a water bottle
    kicker:
      de: Die Herausforderung
      en: The challenge
    headline:
      de: Wachsen. Lernen. Trainieren. / *Alles braucht Energie.*
      en: Growing. Learning. Training. / *It all takes energy.*
    text:
      de: Schule, Hausaufgaben, Fahrwege, Training. Und mittendrin ein Körper, der noch wächst und besonders viel Energie braucht.
      en: School, homework, commuting, training. And in the middle of it all, a body that's still growing and needs a lot of energy.
    text_2:
      de: Doch zwischen all den Terminen bleibt die richtige Ernährung schnell auf der Strecke.
      en: But between all those commitments, the right nutrition easily gets lost.
    text_3:
      de: Wisst ihr eigentlich, wie viel Energie euer Kind an Trainingstagen braucht?
      en: Do you actually know how much energy your child needs on training days?

  loesung:
    kicker:
      de: Die Lösung
      en: The solution
    headline:
      de: Ein Plan. *Zwei Kanäle.*
      en: One plan. *Two channels.*
    sub:
      de: ProspectFuel macht euch die Ernährungsplanung einfacher und begleitet euer Kind im Alltag. Abgestimmt auf Schule, Training und Wachstum.
      en: ProspectFuel makes nutrition planning easier for you and supports your child day to day. Tailored to school, training and growth.
    title:
      de: Für euch. Alles im Blick.
      en: For you. Everything at a glance.
    text:
      de: Was steht an? Was muss vorbereitet werden? Was kommt in die Sporttasche? Euer Wochenplan gibt euch den Überblick.
      en: What's coming up? What needs prepping? What goes in the sports bag? Your weekly plan gives you the overview.
    title_2:
      de: Für euer Kind. Immer dabei.
      en: For your child. Always there.
    text_2:
      de: Ein persönlicher Fueling-Coach direkt auf WhatsApp. Mit Tipps, Antworten und Erinnerungen zum richtigen Zeitpunkt.
      en: A personal fueling coach right on WhatsApp. With tips, answers and reminders at the right time.
    text_3:
      de: Beispielhafte Darstellung
      en: Illustrative example

