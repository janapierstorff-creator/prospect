# Baut die Seiten aus content/texts.yml und src/ und veröffentlicht sie auf GitHub Pages.
# Läuft automatisch nach jeder Änderung auf main, z. B. wenn texts.yml auf github.com bearbeitet wird.
name: Website bauen und veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Seiten aus texts.yml bauen
        run: |
          pip install pyyaml
          python i18n/build.py

      - name: Gebaute Seiten im Repository aktualisieren
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A de/ en/ index.html athletes.html parents.html coaches.html confirm.html athleten.html eltern.html impressum.html datenschutz.html
          if ! git diff --cached --quiet; then
            git commit -m "Seiten aus texts.yml neu gebaut"
            git push
          fi

      - name: Öffentliche Dateien zusammenstellen
        run: |
          mkdir _site
          cp -r index.html athletes.html parents.html coaches.html confirm.html athleten.html eltern.html impressum.html datenschutz.html de en css js assets CNAME .nojekyll _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
